[package]
name = "armature"
description = "A cross-platform GUI framework: windows, events, layout and widgets, with no look of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
cc = "1"

[dependencies]
armature-render.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
winit = "0.30"
pollster = "1.0.1"
regex = "1.13.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# Dragging files out to other apps, through the shell's own data object,
# and where the pointer is while another app's drag is over a window.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
raw-window-handle = "0.6"
